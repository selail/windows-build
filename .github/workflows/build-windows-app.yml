name: Build Windows App
# Named after the dispatching correlationId so the Luxi server can find this specific run via the Actions
# REST API — repository_dispatch's own response carries no run id back to the caller.
run-name: windows-build-${{ github.event.client_payload.correlationId }}

on:
  repository_dispatch:
    types: [build-windows-app]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # A raw ${{ }} interpolation of sourceZipUrl into any run: step's script text would otherwise be
      # echoed verbatim in that step's own "##[group]Run ..." log line — and this is a PUBLIC repo, so
      # that log is world-readable. actions/github-script accesses the payload via the JS `context`
      # object at runtime instead of through ${{ }} pre-substitution, so nothing is interpolated into
      # this step's own visible script text; core.setSecret masks the value for every later step's log
      # output (including their own command-echo lines) from this point on. The URL is presigned and
      # short-lived regardless (see WindowsAppBuildService.SOURCE_URL_EXPIRY) — this is defense in depth,
      # not the only safeguard.
      - name: Mask the source zip URL
        uses: actions/github-script@v7
        with:
          script: core.setSecret(context.payload.client_payload.sourceZipUrl)

      - name: Download source zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ github.event.client_payload.sourceZipUrl }}" -OutFile source.zip

      - name: Unzip source
        shell: pwsh
        run: Expand-Archive -Path source.zip -DestinationPath src

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single-file, win-x64)
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path src -Filter *.csproj | Select-Object -First 1
          # -r win-x64 alone doesn't set MSBuild's Platform property (it defaults to AnyCPU, which
          # Self-Contained mode rejects: "The platform 'AnyCPU' is not supported for Self Contained
          # mode") — the generated .csproj declares Platforms x86;x64;ARM64 with no single default, so
          # Platform must be pinned explicitly to match the RID.
          dotnet publish $csproj.FullName -c Release -r win-x64 -p:Platform=x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            --verbosity detailed `
            -o publish

      # Uploaded un-zipped: actions/upload-artifact zips the contents of `path` itself, so downloading
      # this artifact via the Actions API returns exactly the app zip the server hands the user — no
      # double-zip unwrapping needed on the server side.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.correlationId }}
          path: publish/
          retention-days: 1
          if-no-files-found: error
